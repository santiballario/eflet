server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router maneja las rutas en el navegador (/viajes, /mis-viajes/3...).
    # Si alguien recarga en una de esas rutas, nginx no encuentra un archivo
    # con ese nombre: le devolvemos index.html y React muestra la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }
}